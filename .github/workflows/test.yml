name: Test Extension

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-wasip2
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting and lints
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked --lib

      - name: Build WASM
        run: ./scripts/build_wasm.sh

      - name: Run integration tests
        run: ./test_extension.sh

      - name: Run clean install test
        run: ./test_clean_install.sh

      - name: Verify extension structure
        run: |
          test -f extension.toml
          test -f extension.wasm
          grep -Eq '^version = "[0-9]+\.[0-9]+\.[0-9]+' extension.toml
          grep -q "css-variable-lsp" extension.toml
